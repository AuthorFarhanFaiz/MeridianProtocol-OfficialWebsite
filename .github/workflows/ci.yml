name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Verify dist
        run: |
          test -d dist
          echo "Build output:"
          ls -lah dist

      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true

# Deployment is handled by Cloudflare's own Build & Deploy integration
# (connected directly to this repo's `main` branch — see Cloudflare
# dashboard → this Worker → Settings → Build). This workflow is a CI
# quality gate only (typecheck / lint / build) and does not deploy.
