name: Meridian Pi Testnet Final Deployment

on:
  push:
    branches:
      - fix/pi-testnet-domain-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-pi-testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify deployment target
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.pi-testnet.jsonc
          grep -Fq '"name": "meridianprotocol-pi-testnet"' wrangler.pi-testnet.jsonc
          grep -Fq 'testnet.meridianprotocol.site' wrangler.pi-testnet.jsonc
          test -s public/validation-key.txt
          test -s public/pi/pi-app-validation.txt
          echo "Pi Testnet target and validation files verified."

      - name: Install dependencies
        run: npx --yes pnpm@8.15.9 install --frozen-lockfile

      - name: Build website
        run: npx --yes pnpm@8.15.9 run build

      - name: Cloudflare dry run
        run: npx --yes wrangler@4.161.0 deploy --dry-run --config wrangler.pi-testnet.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Pi Testnet Worker only
        run: npx --yes wrangler@4.161.0 deploy --config wrangler.pi-testnet.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live validation files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pi-check

          verify_file() {
            local source="$1"
            local url="$2"
            local output="$3"

            for attempt in $(seq 1 12); do
              if curl -fsSL "$url" -o "$output" && cmp -s "$source" "$output"; then
                echo "PASS: $url"
                return 0
              fi
              sleep 5
            done

            echo "FAIL: $url"
            return 1
          }

          verify_file public/validation-key.txt \
            https://testnet.meridianprotocol.site/validation-key.txt \
            /tmp/pi-check/developer-key.txt

          verify_file public/pi/pi-app-validation.txt \
            https://testnet.meridianprotocol.site/pi/pi-app-validation.txt \
            /tmp/pi-check/pi-app-key.txt

          curl -fsSL -o /dev/null \
            https://testnet.meridianprotocol.site/pi

          echo "PASS: Pi route is responding."

      - name: Final report
        run: |
          echo "SUCCESS: Pi Testnet deployment and live checks completed."
          echo "Target: meridianprotocol-pi-testnet"
          echo "Main production Worker was not targeted."
          
