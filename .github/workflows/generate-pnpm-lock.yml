name: Generate pnpm lockfile

on:
  workflow_dispatch:

jobs:
  generate-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Install dependencies (generate lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Commit pnpm-lock.yaml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f pnpm-lock.yaml ]; then
            git add pnpm-lock.yaml
            if ! git diff --staged --quiet; then
              git commit -m "chore: add pnpm-lock.yaml (generated by CI)"
            else
              echo "No changes to pnpm-lock.yaml"
            fi
          else
            echo "pnpm-lock.yaml was not created"
          fi

      - name: Push to main
        run: git push origin HEAD:main
